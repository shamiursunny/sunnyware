<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sunnyware - Status</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --card2:#1b202b;
    --text:#e7ecf3; --dim:#8892a6;
    --accent:#5b8def; --ok:#2ecc71; --warn:#f5a623; --err:#e74c3c;
    --border:#232a38;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:16px 24px;
    border-bottom:1px solid var(--border);position:sticky;top:0;
    background:rgba(11,13,18,.92);backdrop-filter:blur(8px);z-index:10;
    flex-wrap:wrap}
  header h1{font-size:18px;margin:0;letter-spacing:.3px}
  header .spacer{flex:1}
  .badge{padding:4px 10px;border-radius:20px;font-size:12px;
    font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  .badge.ok{background:rgba(46,204,113,.15);color:var(--ok);
    border:1px solid rgba(46,204,113,.4)}
  .badge.warn{background:rgba(245,166,35,.15);color:var(--warn);
    border:1px solid rgba(245,166,35,.4)}
  .badge.err{background:rgba(231,76,60,.15);color:var(--err);
    border:1px solid rgba(231,76,60,.4)}
  .badge.dim{background:rgba(136,146,166,.15);color:var(--dim);
    border:1px solid rgba(136,146,166,.3)}
  .muted{color:var(--dim);font-size:12px}
  button{cursor:pointer;font:inherit}
  main{display:grid;gap:16px;padding:20px 24px 40px;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    max-width:1500px;margin:0 auto}
  section.card{background:var(--card);border:1px solid var(--border);
    border-radius:10px;padding:16px 18px;min-height:140px;
    display:flex;flex-direction:column;gap:10px}
  section.card h2{font-size:13px;margin:0;text-transform:uppercase;
    letter-spacing:.8px;color:var(--dim);font-weight:600;
    display:flex;align-items:center;gap:8px}
  section.card h2 .dot{width:8px;height:8px;border-radius:50%;
    background:var(--dim);flex:0 0 auto;transition:background .3s}
  .card-body{flex:1;min-height:40px}
  .big{font-size:28px;font-weight:700;line-height:1}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;
    font-size:13px;margin-top:6px}
  .kv .k{color:var(--dim)}
  .kv .v{font-family:var(--mono);font-size:12px;word-break:break-all}
  pre.json{margin:6px 0 0;font-family:var(--mono);font-size:11.5px;
    color:var(--text);white-space:pre-wrap;word-break:break-word;
    max-height:220px;overflow-y:auto;padding:8px;
    background:var(--card2);border-radius:6px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
  th,td{text-align:left;padding:6px 8px;
    border-bottom:1px solid var(--border)}
  th{color:var(--dim);font-weight:500}
  tr:last-child td{border-bottom:none}
  .bar{width:100%;height:8px;background:var(--card2);border-radius:4px;
    overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;
    background:linear-gradient(90deg,var(--accent),#7fb0ff);
    transition:width .3s ease}
  .bar.warn>i{background:linear-gradient(90deg,#f5a623,#ffce6b)}
  .bar.err>i{background:linear-gradient(90deg,#e74c3c,#ff8c80)}
  .err-msg{color:var(--err);font-size:12px;font-family:var(--mono);
    margin-top:6px}
  .loading::after{content:"loading...";color:var(--dim);font-size:12px}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>

<header>
  <h1>Sunnyware - Status</h1>
  <span id="badge-health" class="badge dim">...</span>
  <span class="spacer"></span>
  <span class="muted" id="refresh-info">-</span>
  <button id="refresh-now" class="badge ok">Refresh</button>
  <span class="muted" id="countdown">5s</span>
</header>

<main id="grid"></main>

<script>
"use strict";
var POLL_MS = 10000;

var SUMMARY_URL = "/api/status/summary";
var CARDS = [
  { id:"health",    title:"Health",         key:"health",    render:renderHealth },
  { id:"budget",    title:"Budget",         key:"budget",    render:renderBudget },
  { id:"golden",    title:"Golden dataset", key:"golden",    render:renderGolden },
  { id:"evals",     title:"Evals",          key:"evals",     render:renderEvals },
  { id:"circuits",  title:"Tool circuits",  key:"circuits",  render:renderCircuits },
  { id:"recon",     title:"Recon guard",    key:"recon",     render:renderRecon },
  { id:"audit",     title:"Audit chain",    key:"audit",     render:renderAudit },
  { id:"providers", title:"Providers",      key:"providers", render:renderProviders },
  { id:"neon",      title:"Neon DB",        key:"neon",      render:renderNeon },
  { id:"ci",        title:"CI/CD",          key:"ci",        render:renderCI }
];

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}
function fmtRelative(ts){
  if (!ts) return "-";
  var d = typeof ts === "number" ? ts * 1000 : new Date(ts).getTime();
  var s = Math.floor((Date.now() - d) / 1000);
  if (s < 0) return "just now";
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
function fmtUsd(v){
  if (v == null) return "-";
  return "$" + Number(v).toFixed(4);
}
function badge(cls, txt){
  var b = el("span", "badge " + cls);
  b.textContent = txt;
  return b;
}
function kv(obj){
  var w = el("div", "kv");
  var ks = Object.keys(obj || {});
  for (var i = 0; i < ks.length; i++){
    var k = ks[i], v = obj[k];
    w.appendChild(el("span", "k", k));
    var vv = el("span", "v");
    vv.textContent = (typeof v === "object" && v !== null)
      ? JSON.stringify(v) : String(v);
    w.appendChild(vv);
  }
  return w;
}
function pre(obj){
  var p = el("pre", "json");
  p.textContent = JSON.stringify(obj, null, 2);
  return p;
}

function renderHealth(d){
  var c = el("div");
  var inner = d;
  if (d && typeof d.body === "string"){
    try { inner = JSON.parse(d.body); } catch (_) { inner = d; }
  }
  if (!inner || typeof inner !== "object"){
    c.appendChild(badge("err", "DOWN"));
    c.appendChild(el("div", "muted", "no payload"));
    return c;
  }
  function isOk(v){
    if (v === true || v === null) return true;
    if (typeof v === "number") return v > 0;
    if (typeof v === "string"){
      var s = v.toLowerCase().trim();
      if (!s) return false;
      if (s === "ok" || s === "ready" || s === "live"
          || s === "up" || s === "healthy" || s === "true")
        return true;
      if (/^(fail|error|down|off|no|false|0)/.test(s)) return false;
      return true;
    }
    return false;
  }
  var ok = inner.status === "ok" || inner.status === "ready"
        || inner.ok === true || inner.ready === true;
  if (!ok && inner.checks && typeof inner.checks === "object"){
    ok = Object.keys(inner.checks).every(function(k){
      return isOk(inner.checks[k]);
    });
  }
  var top = el("div");
  top.style.display = "flex";
  top.style.alignItems = "center";
  top.style.gap = "10px";
  top.appendChild(badge(ok ? "ok" : "err", ok ? "READY" : "DOWN"));
  if (inner.status){
    var st = el("span", "muted");
    st.textContent = "status: " + inner.status;
    top.appendChild(st);
  }
  c.appendChild(top);

  var checks = (inner.checks && typeof inner.checks === "object")
    ? inner.checks : {};
  function pick(){
    for (var i = 0; i < arguments.length; i++){
      var k = arguments[i];
      if (inner[k] !== undefined) return inner[k];
      if (checks[k] !== undefined) return checks[k];
    }
    return undefined;
  }
  var stats = [];
  var tv = pick("tools");
  if (tv !== undefined) stats.push(["Tools", String(tv)]);
  var pv = pick("providers");
  if (pv !== undefined) stats.push(["Providers", String(pv)]);
  var sv = pick("persistent_storage", "storage");
  if (sv !== undefined)
    stats.push(["Storage", (sv === true || sv === "true")
      ? "persistent" : String(sv)]);
  var wv = pick("workspace_path");
  if (wv !== undefined) stats.push(["Workspace", String(wv)]);
  var av = pick("author");
  if (av !== undefined) stats.push(["Author", String(av)]);

  if (stats.length){
    var grid = el("div");
    grid.style.display = "grid";
    grid.style.gridTemplateColumns =
      "repeat(auto-fill, minmax(140px, 1fr))";
    grid.style.gap = "8px";
    grid.style.marginTop = "10px";
    stats.forEach(function(kv){
      var chip = el("div");
      chip.style.background = "var(--card2)";
      chip.style.padding = "8px 10px";
      chip.style.borderRadius = "6px";
      chip.style.border = "1px solid var(--border)";
      var lab = el("div", "muted");
      lab.style.fontSize = "11px";
      lab.style.textTransform = "uppercase";
      lab.style.letterSpacing = "0.05em";
      lab.textContent = kv[0];
      var val = el("div");
      val.style.fontSize = "15px";
      val.style.fontWeight = "600";
      val.style.marginTop = "2px";
      val.style.wordBreak = "break-all";
      val.textContent = kv[1];
      chip.appendChild(lab);
      chip.appendChild(val);
      grid.appendChild(chip);
    });
    c.appendChild(grid);
  }

  var SKIP = { tools:1, providers:1, persistent_storage:1,
               workspace_path:1, author:1, status:1 };
  var subKeys = Object.keys(checks).filter(function(k){
    return !SKIP[k];
  });
  if (subKeys.length){
    var section = el("div");
    section.style.marginTop = "12px";
    var hdr = el("div", "muted");
    hdr.style.fontSize = "11px";
    hdr.style.textTransform = "uppercase";
    hdr.style.letterSpacing = "0.05em";
    hdr.style.marginBottom = "6px";
    hdr.textContent = "subsystems";
    section.appendChild(hdr);

    var cgrid = el("div");
    cgrid.style.display = "grid";
    cgrid.style.gridTemplateColumns =
      "repeat(auto-fill, minmax(120px, 1fr))";
    cgrid.style.gap = "6px 12px";
    subKeys.forEach(function(k){
      var v = checks[k];
      var okv = isOk(v);
      var row = el("div");
      row.style.display = "flex";
      row.style.alignItems = "center";
      row.style.gap = "6px";
      row.style.fontSize = "12px";
      var dot = el("span");
      dot.style.width = "7px";
      dot.style.height = "7px";
      dot.style.borderRadius = "50%";
      dot.style.flex = "0 0 auto";
      dot.style.background = okv ? "var(--ok)" : "var(--err)";
      row.appendChild(dot);
      var name = el("span");
      name.style.color = okv ? "var(--text)" : "var(--err)";
      name.textContent = k;
      row.appendChild(name);
      cgrid.appendChild(row);
    });
    section.appendChild(cgrid);
    c.appendChild(section);
  }

  return c;
}
function renderBudget(d){
  var c = el("div");
  var daily = (d && d.daily) || {};
  var monthly = (d && d.monthly) || {};
  if (!daily.enabled && !monthly.enabled){
    c.appendChild(badge("dim", "DISABLED"));
    c.appendChild(el("div", "muted", "SUNNYWARE_BUDGET_USD_* not set"));
    return c;
  }
  c.appendChild(renderBudgetRow("Today", daily));
  c.appendChild(el("div", "muted", " "));
  c.appendChild(renderBudgetRow("Month", monthly));
  if (d.alert_thresholds_pct){
    c.appendChild(el("div", "muted",
      "thresholds: " + d.alert_thresholds_pct.join(", ") + "%"));
  }
  return c;
}
function renderBudgetRow(label, x){
  var w = el("div");
  var top = el("div");
  top.appendChild(el("span", null, label + " - "));
  top.appendChild(el("strong", null, fmtUsd(x.used_usd)));
  top.appendChild(el("span", "muted",
    " / " + fmtUsd(x.cap_usd) + "  (" + (x.pct || 0).toFixed(2) + "%)"));
  w.appendChild(top);
  var bar = el("div", "bar");
  if ((x.pct || 0) >= 95) bar.classList.add("err");
  else if ((x.pct || 0) >= 80) bar.classList.add("warn");
  var fill = el("i");
  fill.style.width = Math.min(100, Math.max(0, x.pct || 0)) + "%";
  bar.appendChild(fill);
  w.appendChild(bar);
  return w;
}
function renderGolden(d){
  var c = el("div");
  // Accept three shapes: {run:{...}}, top-level run, or {runs:[...]}
  var r = (d && d.run) || (d && d.runs && d.runs.length ? d.runs[0] : null)
          || (d && (d.cases || d.run_id) ? d : null);
  if (!r){
    c.appendChild(badge("dim", "NO RUNS"));
    return c;
  }
  // Derive passed/total/score flexibly
  var passed = r.passed;
  var total = r.total;
  var score = r.score;
  if (r.summary){
    if (passed == null) passed = r.summary.passed;
    if (total == null) total = r.summary.total;
    if (score == null) score = r.summary.score;
  }
  if (Array.isArray(r.cases)){
    total = r.cases.length;
    passed = r.cases.filter(function(x){
      return x && (x.status === "pass" || x.passed === true);
    }).length;
    if (score == null) score = total ? passed / total : 0;
  }
  var ok = (passed != null && total != null && passed === total);
  var big = el("div", "big");
  big.textContent = (passed != null ? passed : "?") + " / "
                  + (total != null ? total : "?");
  big.style.color = ok ? "var(--ok)"
                    : (passed != null ? "var(--warn)" : "var(--dim)");
  c.appendChild(big);
  c.appendChild(el("div", "muted",
    "score " + (score != null ? Number(score).toFixed(3) : "-")
    + "  -  " + fmtRelative(r.started_at || r.ts)));
  return c;
}
function renderEvals(d){
  var c = el("div");
  var runs = (d && (d.runs || d.recent)) || [];
  if (!runs.length){ c.appendChild(badge("dim", "NO RUNS")); return c; }
  c.appendChild(el("div", "muted", "last " + Math.min(runs.length, 5)
    + " runs"));
  var tbl = el("table");
  var head = el("tr");
  ["when", "score", "passed"].forEach(function(x){
    head.appendChild(el("th", null, x));
  });
  tbl.appendChild(head);
  runs.slice(-5).reverse().forEach(function(r){
    var s = r.summary || {};
    var when = r.started_at || r.ts;
    var score = (s.score != null) ? s.score
                : (r.score != null) ? r.score : null;
    var passed = (s.passed != null) ? s.passed
                 : (r.passed != null) ? r.passed : null;
    var total = (s.total != null) ? s.total
                : (r.total != null) ? r.total : null;
    var tr = el("tr");
    tr.appendChild(el("td", null, fmtRelative(when)));
    var tds = el("td");
    tds.textContent = (score != null) ? Number(score).toFixed(2) : "-";
    if (score != null && score < 0.8) tds.style.color = "var(--warn)";
    if (score != null && score < 0.5) tds.style.color = "var(--err)";
    tr.appendChild(tds);
    tr.appendChild(el("td", null,
      (passed != null ? passed : "?") + "/" +
      (total != null ? total : "?")));
    tbl.appendChild(tr);
  });
  c.appendChild(tbl);
  return c;
}
function renderCircuits(d){
  var c = el("div");
  if (!d){ c.appendChild(el("div", "err-msg", "no data")); return c; }
  var tools = d.tools || [];
  var open = tools.filter(function(t){ return t.open; });
  if (!open.length){
    c.appendChild(badge("ok", "ALL CLOSED"));
    c.appendChild(el("div", "muted",
      "threshold " + d.fails_threshold + " fails - cooldown "
      + d.cooldown_seconds + "s - tracked: " + tools.length));
    return c;
  }
  c.appendChild(badge("err", open.length + " OPEN"));
  var tbl = el("table");
  var head = el("tr");
  ["tool", "retry in", "fails"].forEach(function(x){
    head.appendChild(el("th", null, x));
  });
  tbl.appendChild(head);
  open.forEach(function(t){
    var tr = el("tr");
    tr.appendChild(el("td", null, t.name));
    tr.appendChild(el("td", null, t.remaining_open_s + "s"));
    tr.appendChild(el("td", null, String(t.total_fails)));
    tbl.appendChild(tr);
  });
  c.appendChild(tbl);
  return c;
}
function renderRecon(d){
  var c = el("div");
  if (!d){ c.appendChild(el("div", "err-msg", "no data")); return c; }
  var total = d.blocked_total || 0;
  var big = el("div", "big");
  big.textContent = String(total);
  big.style.color = total > 0 ? "var(--warn)" : "var(--dim)";
  c.appendChild(big);
  c.appendChild(el("div", "muted",
    "blocked - " + d.patterns_count + " patterns"));
  var recent = (d.recent || []).slice(-5).reverse();
  if (recent.length){
    var tbl = el("table");
    var head = el("tr");
    ["path", "ip"].forEach(function(x){
      head.appendChild(el("th", null, x));
    });
    tbl.appendChild(head);
    recent.forEach(function(e){
      var tr = el("tr");
      tr.appendChild(el("td", null, e.path));
      tr.appendChild(el("td", null, e.ip || "-"));
      tbl.appendChild(tr);
    });
    c.appendChild(tbl);
  }
  return c;
}
function renderAudit(d){
  var c = el("div");
  if (!d){ c.appendChild(el("div", "err-msg", "no data")); return c; }
  var ok = d.ok === true;
  c.appendChild(badge(ok ? "ok" : "err", ok ? "CHAIN OK" : "TAMPERED"));
  c.appendChild(el("div", "muted", (d.count || 0) + " entries"));
  if (!ok){
    c.appendChild(el("div", "err-msg",
      "first bad index " + d.first_bad_index + ": " + d.reason));
  }
  return c;
}
function renderProviders(d){
  var c = el("div");
  var src = d && (d.providers || d.list || d.items);
  var arr = [];
  if (Array.isArray(src)) arr = src;
  else if (src && typeof src === "object"){
    arr = Object.keys(src).map(function(k){
      var v = src[k];
      return Object.assign({ name: k }, (v && typeof v === "object") ? v : {});
    });
  }
  if (!arr.length){
    c.appendChild(badge("dim", "NO DATA"));
    return c;
  }
  var tbl = el("table");
  var head = el("tr");
  ["provider", "status", "model"].forEach(function(x){
    head.appendChild(el("th", null, x));
  });
  tbl.appendChild(head);
  arr.forEach(function(p){
    var tr = el("tr");
    tr.appendChild(el("td", null, p.name || p.provider || "?"));
    var s = p.status || p.state;
    if (!s){
      if (p.cooling) s = "cooling";
      else if (p.last_error) s = "error";
      else s = "ready";
    }
    s = String(s);
    var cls = /ready|ok|healthy|up/i.test(s) ? "ok"
      : /cooling/i.test(s) ? "warn"
      : /down|error|fail/i.test(s) ? "err" : "dim";
    var td = el("td");
    td.appendChild(badge(cls, s.toUpperCase()));
    tr.appendChild(td);
    tr.appendChild(el("td", "muted",
      String(p.model || "").slice(0, 32)));
    tbl.appendChild(tr);
  });
  var readyN = arr.filter(function(p){
    return !p.cooling && !p.last_error;
  }).length;
  c.appendChild(el("div", "muted",
    readyN + " / " + arr.length + " ready"));
  c.appendChild(tbl);
  return c;
}

var GRID = document.getElementById("grid");
var CARDS_BY_ID = {};

(function buildGrid(){
  for (var i = 0; i < CARDS.length; i++){
    var spec = CARDS[i];
    var s = el("section", "card");
    s.id = "card-" + spec.id;
    var h = el("h2");
    var dot = el("span", "dot");
    h.appendChild(dot);
    h.appendChild(el("span", null, spec.title));
    s.appendChild(h);
    var body = el("div", "card-body loading");
    body.id = "body-" + spec.id;
    s.appendChild(body);
    GRID.appendChild(s);
    CARDS_BY_ID[spec.id] = { spec: spec, s: s, body: body, dot: dot };
  }
})();

function renderNeon(d){
  var c = el("div");
  if (!d || d.__error__){
    c.appendChild(badge("dim", "UNKNOWN"));
    var m = el("div", "muted");
    m.textContent = "waiting for probe";
    c.appendChild(m);
    return c;
  }
  var s = d.status || "unknown";
  var cls = s === "up" ? "ok" : s === "down" ? "err" : "dim";
  var txt = s === "up" ? "UP" : s === "down" ? "DOWN" : "UNKNOWN";
  c.appendChild(badge(cls, txt));

  if (d.latency_ms != null){
    var big = el("div", "big");
    big.textContent = d.latency_ms + " ms";
    big.style.color = d.latency_ms < 100 ? "var(--ok)"
                    : d.latency_ms < 400 ? "var(--warn)"
                    : "var(--err)";
    c.appendChild(big);
    var cap = el("div", "muted");
    cap.textContent = "SELECT 1 round trip";
    c.appendChild(cap);
  }

  var info = {};
  if (d.region) info["Region"] = d.region;
  if (Object.keys(info).length) c.appendChild(kv(info));

  // Show detail as a compact single-line muted message, not a wall of text
  if (d.detail){
    var det = el("div", "muted");
    det.style.marginTop = "8px";
    det.style.fontSize = "12px";
    det.style.wordBreak = "break-word";
    det.textContent = String(d.detail).split("\n")[0].slice(0, 140);
    c.appendChild(det);
  }
  return c;
}

function renderCI(d){
  var c = el("div");
  if (!d || d.ok === false){
    c.appendChild(badge("err", "UNREACHABLE"));
    if (d && d.detail) c.appendChild(el("div","err-msg", d.detail));
    return c;
  }
  var runs = d.runs || [];
  if (!runs.length){
    c.appendChild(badge("dim", "NO RUNS"));
    return c;
  }
  var head = runs[0];
  var head_cls = head.conclusion === "success" ? "ok"
               : head.conclusion === "failure" ? "err"
               : "warn";
  var head_txt = (head.conclusion || head.status || "?").toUpperCase();
  c.appendChild(badge(head_cls, head_txt));
  c.appendChild(el("div", "muted",
    (head.name || "?") + "  -  " + (head.sha || "?")
    + "  -  " + (head.branch || "?")));

  var tbl = el("table");
  var hd = el("tr");
  ["run", "when", "time", "result"].forEach(function(x){
    hd.appendChild(el("th", null, x));
  });
  tbl.appendChild(hd);
  runs.forEach(function(r){
    var tr = el("tr");
    tr.appendChild(el("td", null, r.name || "?"));
    tr.appendChild(el("td", null, fmtRelative(r.updated_at)));
    tr.appendChild(el("td", null,
      r.duration_s != null ? r.duration_s + "s" : "-"));
    var td = el("td");
    var cl = r.conclusion === "success" ? "ok"
           : r.conclusion === "failure" ? "err"
           : "warn";
    var b = badge(cl, (r.conclusion || r.status || "?").toUpperCase());
    var a = el("a");
    a.href = r.url || "#"; a.target = "_blank"; a.rel = "noreferrer";
    a.appendChild(b);
    td.appendChild(a);
    tr.appendChild(td);
    tbl.appendChild(tr);
  });
  c.appendChild(tbl);
  return c;
}

function renderCardFromSummary(id, summary){
  var rec = CARDS_BY_ID[id];
  if (!rec) return;
  var spec = rec.spec, body = rec.body, dot = rec.dot;
  body.classList.remove("loading");
  body.innerHTML = "";
  var d = summary ? summary[spec.key] : null;
  if (d && d.__error__){
    dot.style.background = "var(--err)";
    body.appendChild(el("div", "err-msg", d.__error__));
    return;
  }
  if (d === undefined || d === null){
    dot.style.background = "var(--warn)";
    body.appendChild(el("div", "err-msg",
      "no data for key: " + spec.key));
    return;
  }
  dot.style.background = "var(--ok)";
  try {
    body.appendChild(spec.render(d));
  } catch (e){
    dot.style.background = "var(--err)";
    body.innerHTML = "";
    body.appendChild(el("div", "err-msg",
      "render error: " + ((e && e.message) || String(e))));
  }
}

async function refreshAll(){
  var badge = document.getElementById("badge-health");
  try {
    var r = await fetch(SUMMARY_URL, { cache: "no-store" });
    var summary = null;
    try { summary = await r.json(); } catch (_) { summary = null; }
    if (!r.ok){
      badge.className = "badge err";
      badge.textContent = "HTTP " + r.status;
      var msg = (summary && summary.detail) ? summary.detail
                : ("summary failed: HTTP " + r.status);
      for (var j = 0; j < CARDS.length; j++){
        var rec = CARDS_BY_ID[CARDS[j].id];
        if (!rec) continue;
        rec.dot.style.background = "var(--err)";
        rec.body.classList.remove("loading");
        rec.body.innerHTML = "";
        rec.body.appendChild(el("div", "err-msg", msg));
      }
      document.getElementById("refresh-info").textContent =
        "error at " + new Date().toLocaleTimeString();
      return;
    }
    badge.className = "badge ok";
    badge.textContent = "READY";
    document.getElementById("refresh-info").textContent =
      "updated " + new Date().toLocaleTimeString();
    for (var k = 0; k < CARDS.length; k++){
      renderCardFromSummary(CARDS[k].id, summary);
    }
  } catch (e){
    badge.className = "badge err";
    badge.textContent = "UNREACHABLE";
    document.getElementById("refresh-info").textContent =
      "unreachable at " + new Date().toLocaleTimeString();
    for (var m = 0; m < CARDS.length; m++){
      var rec2 = CARDS_BY_ID[CARDS[m].id];
      if (!rec2) continue;
      rec2.dot.style.background = "var(--err)";
      rec2.body.classList.remove("loading");
      rec2.body.innerHTML = "";
      rec2.body.appendChild(el("div", "err-msg",
        (e && e.message) || "fetch failed"));
    }
  }
}

(function countdown(){
  var n = Math.round(POLL_MS / 1000);
  var e = document.getElementById("countdown");
  e.textContent = n + "s";
  setInterval(function(){
    n -= 1;
    if (n <= 0) n = Math.round(POLL_MS / 1000);
    e.textContent = n + "s";
  }, 1000);
})();

document.getElementById("refresh-now").addEventListener("click", refreshAll);

refreshAll();
setInterval(refreshAll, POLL_MS);
</script>
