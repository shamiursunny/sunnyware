name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Required gate: system monitor ────────────────────────────────
  # Runs system_monitor.py --quick. Deterministic, no DB / /data /
  # network dependency. If this fails, the code is broken.
  monitor:
    name: system monitor (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run system monitor (quick)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python scripts/system_monitor.py --quick

  # ─── Informational: full smoke suite ──────────────────────────────
  # Runs all 99 smokes. Many need DB / /data / live providers, so a
  # failure here is a signal, not a blocker. Never fails the workflow.
  smokes:
    name: full smokes (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Prepare /data volume
        run: |
          sudo mkdir -p /data/workspace /data/attachments
          sudo chown -R "$(whoami)" /data
          ls -ld /data /data/workspace

      - name: Run all smokes
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/run_all_smokes.py --timeout 120 --verbose
