name: smokes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: smokes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Prepare /data volume
        run: |
          # HF Space has a writable /data volume. GitHub runners do not,
          # so we recreate an equivalent here for workspace-scoped tools.
          sudo mkdir -p /data/workspace /data/attachments
          sudo chown -R "$(whoami)" /data
          ls -ld /data /data/workspace

      - name: Run all smokes
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          # Secrets (set in Repo Settings -> Secrets -> Actions).
          # Smokes needing them run; those that need env we don't have
          # are reported as SKIP by run_all_smokes.py.
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python scripts/run_all_smokes.py --timeout 120 --verbose
