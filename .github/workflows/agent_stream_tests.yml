name: Full Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio anyio fastapi httpx starlette
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run deterministic unit tests
      env:
        # Prevent tests from trying to reach a real DB / network
        NEON_DATABASE_URL: ""
        SUNNYWARE_DISABLE_SCHEDULER: "1"
        HF_HOME: /tmp/huggingface
      run: |
        # Run all tests EXCEPT the ones that require real LLM network access
        # and skip the flaky DB health check (requires a live Neon DB)
        pytest tests/ -v --ignore=tests/test_agent_stream.py -k "not test_health_ready"

  fast-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio anyio fastapi httpx starlette
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run deterministic keyword router tests
      run: |
        pytest tests/test_keyword_router_direct.py -v
