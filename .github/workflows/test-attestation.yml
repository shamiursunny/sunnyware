name: Test Attestation

on:
  push:
    branches: [main]
    paths-ignore:
      - 'test-results/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest>=9.0.3 pytest-asyncio>=1.0.0 anyio>=4.14.2 fastapi httpx starlette
          if [ -f requirements-ci.txt ]; then pip install -r requirements-ci.txt; fi

      # ─── Pre-flight checks ───────────────────────────────────
      - name: Pre-push checks
        continue-on-error: true
        run: python scripts/pre_push_check.py

      - name: Local smoke test
        continue-on-error: true
        run: python scripts/smoke_local.py

      - name: System monitor (offline)
        continue-on-error: true
        run: python scripts/system_monitor.py --offline

      # ─── Main tests + attestation ────────────────────────────
      - name: Run tests + generate attestation
        env:
          NEON_DATABASE_URL: ""
          SUNNYWARE_DISABLE_SCHEDULER: "1"
          SUNNYWARE_DATA_DIR: /tmp/sunnyware
        run: python run_tests.py

      - name: Upload artifact (90-day retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-attestation-${{ github.sha }}
          path: test-results/latest/
          retention-days: 90

      - name: Publish attestation
        if: success()
        run: |
          git config user.name "sunnyware-bot"
          git config user.email "bot@sunnyware.local"
          git add reports/ README.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "CI: publish attestation [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
